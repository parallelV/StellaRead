<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StellaRead — Your Digital Library</title>
  <link rel="icon" type="image/x-icon" href="logo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
    :root {
      --bg: #EFE9DD;
      --card: #FFFFFF;
      --muted: #6b6f6a;
      --text: #2f2f2f;
      --accent: #313E34;
      --accent-strong: #24322a;
      --radius: 12px;
      --shadow: 0 12px 30px rgba(45,45,45,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .main-header {
      width: 100%;
      background: #fff;
      padding: 24px 36px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 6px 16px rgba(0,0,0,0.04);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-logo {
      height: 80px;
      width: auto;
    }

    .header-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
    }

    .brand-sub {
      font-size: 14px;
      color: var(--muted);
    }
    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 28px;
    }
    .card {
      width: min(1100px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.03);
      margin-top:-120px;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 44px;
      padding: 56px 60px 64px;
      margin-top: -28px; 
    }

    .left {
      max-width: 520px;
    }
    .page-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .form {
      max-width: 480px;
      margin-top: 12px;
    }

    .form label {
      display: block;
      margin: 20px 0 8px;
      font-size: 0.97rem;
      color: var(--muted);
      font-weight: 600;
    }

    .form input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #e6e0d6;
      background: #fff;
      font-size: 1rem;
      color: var(--text);
    }

    .form input::placeholder {
      color: #a49e95;
    }

    .form input:focus {
      border-color: var(--accent-strong);
      box-shadow: 0 8px 18px rgba(49,62,52,0.08);
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 14px 20px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: all .12s ease;
    }

    .btn-primary {
      background: #313E34;
      color: white;
      border: 1px solid var(--accent);
      font-size: 1.25rem;
    }

    .btn-primary:hover {
      background: #EFE9DD;
      color: var(--accent);
      border-color: var(--accent-strong);
    }

    .full {
      width: 100%;
      margin-top: 26px;
    }

    .btn-secondary {
      background: #313E34;
      color: white;
      border: 1px solid var(--accent);
      font-size: 1.25rem;
    }

    .btn-secondary:hover {
      background: #EFE9DD;
      color: var(--accent);
      border-color: var(--accent-strong);
    }


    .row {
      margin-top: 10px;
      font-size: 0.95rem;
    }

    .kv {
      color: var(--muted);
    }

    .link {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    .right {
      display: grid;
      place-items: center;
    }

    .book-image {
      width: 420px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    .error {
      color: #b00020;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    .toggle-btn {
      position: absolute;
      right: 10px;
      top: 8px;
      border: none;
      background: none;
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
        padding: 32px 26px;
        gap: 36px;
      }

      .right {
        order: -1;
        margin-bottom: 26px;
      }

      .book-image {
        width: 280px;
      }

      .main-header {
        padding: 18px 24px;
        gap: 12px;
      }

      .header-logo {
        height: 60px;
      }
    }
  </style>
</head>
<body>
  <header class="main-header">
    <img src="logo.png" alt="StellaRead logo" class="header-logo">
    <div class="header-text">
      <div class="brand-title">Your Digital Library</div>
      <div class="brand-sub">— StellaRead</div>
    </div>
  </header>

  <main class="page">
    <section class="card" aria-label="StellaRead login card">
      <div class="content">
        <div class="left">
          <h1 class="page-title">Log in</h1>
          <form id="loginForm" class="form" autocomplete="on" novalidate>
            <label for="loginId">Email or Username</label>
            <input id="loginId" name="loginId" type="text" placeholder="you@example.com or username" required>

            <label for="loginPassword">Password</label>
            <div style="position:relative;">
              <input id="loginPassword" name="loginPassword" type="password" placeholder="Enter your password" required>
              <button type="button" id="toggleLoginPassword"
                style="position:absolute;right:10px;top:8px;border:none;background:none;cursor:pointer;color:var(--muted);background-color: #2f2f2f; border-radius: 7px; font-size: x-large">
                👁️
              </button>
            </div>

            <button class="btn btn-primary full" type="submit">Log In</button>
            <br><br>
            <hr>

            <div class="row small-row">
              <button class="btn btn-secondary full" onclick="window.location.href='index.html'">
                Create Account
              </button>
            </div>

            <p id="loginError" class="kv error" style="display:none">Invalid credentials — try again.</p>
          </form>
        </div>
        <div class="right" aria-hidden="true">
          <img src="booktree.png" alt="book illustration" class="book-image">
        </div>
      </div>
    </section>
  </main>

  <div id="notification" style="
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    font-size: 0.95rem;
    font-weight: 600;
    display: none;
    z-index: 2000;
  ">
    Feature not yet available
  </div>

<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbyDEvh_PdsRDCWqpY8qpvq7yif7fY6hZMNHKzG-D2alxqftJS8x37hzXk5NCyQQ4ZV-JA/exec";

  const toggleBtn = document.getElementById("toggleLoginPassword");
  const pwField = document.getElementById("loginPassword");

  toggleBtn.addEventListener("click", () => {
    const isHidden = pwField.type === "password";
    pwField.type = isHidden ? "text" : "password";
    toggleBtn.textContent = isHidden ? "🚫" : "👁️";
  });

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const loginId = document.getElementById('loginId').value.trim();
    const password = pwField.value.trim();
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    if (!loginId || !password) {
      errorEl.style.display = 'block';
      errorEl.textContent = "Please enter your credentials.";
      return;
    }

    const params = new URLSearchParams();
    params.append("action", "login");
    params.append("loginId", loginId);
    params.append("password", password);

    try {
      const response = await fetch(`${scriptURL}?${params.toString()}`, { method: "POST" });
      const result = await response.text();

      if (result === "success") {
        localStorage.setItem("stella_user", loginId);
        alert("✅ You accomplished Task 2 (Log In) — Please proceed to Task 3 (Edit Profile).");
        window.location.href = "main.html";
      } else if (result === "fail") {
        errorEl.style.display = 'block';
        errorEl.textContent = "Invalid credentials — try again.";
      } else {
        errorEl.style.display = 'block';
        errorEl.textContent = "Unexpected response from server.";
      }

    } catch (error) {
      errorEl.style.display = 'block';
      errorEl.textContent = "Network error. Please try again later.";
    }
  });
</script>
</body>
</html>
